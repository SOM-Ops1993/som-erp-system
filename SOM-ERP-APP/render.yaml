services:
  - type: web
    name: som-erp
    runtime: node
    # Render runs build commands from the repo root
    buildCommand: |
      cd frontend && npm install && npm run build && cd ..
      mkdir -p backend/public
      cp -r frontend/dist/. backend/public/
      cd backend && npm install && npx prisma db push --accept-data-loss && npx prisma generate
    startCommand: cd backend && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false        # Set this manually in Render dashboard → Environment
      - key: PORT
        value: "3001"
    healthCheckPath: /health
    autoDeploy: true       # Auto-deploy on every git push
